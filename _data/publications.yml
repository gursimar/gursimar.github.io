- title: Spatio-Temporal Relational Reasoning for Video Question Answering
  authors: Gursimran Singh, Leonid Sigal, and James J. Little
  venue: BMVC 2019
  url: https://www.cs.ubc.ca/~lsigal/Publications/bmvc2019singh.pdf
  image: /assets/publications/videoqa.png
  image_alt: Spatio-temporal relational network with spatial and temporal reasoning modules for video question answering
  summary: A relational network that models interactions between objects and how they change over time to answer
    questions about videos. Joint spatial and temporal reasoning improves performance on challenging tasks such
    as counting.
  distinction: Oral presentation
