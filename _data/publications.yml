- title: Mining Minority-Class Examples with Uncertainty Estimates
  authors: Gursimran Singh, Lingyang Chu, Lanjun Wang, Jian Pei, Qi Tian, and Yong Zhang
  venue: MMM 2022
  url: https://arxiv.org/abs/2112.07835
  image: /assets/publications/minority.png
  image_alt: Minority-class mining pipeline that selects examples from unlabelled data to balance a skewed training
    dataset
  summary: Identifies rare-class examples in unlabeled data by strengthening suppressed class activations and using
    uncertainty estimates. The mined examples help balance training data and improve performance on underrepresented
    classes.
  distinction: Oral presentation
  links:
  - label: paper
    url: https://arxiv.org/pdf/2112.07835
  - label: arXiv
    url: https://arxiv.org/abs/2112.07835
