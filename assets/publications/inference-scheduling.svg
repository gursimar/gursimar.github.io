<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" role="img" aria-labelledby="title desc">
  <title id="title">LLM inference scheduling</title>
  <desc id="desc">An overview illustration of incoming requests flowing through control-plane resource allocation and data-plane execution, balancing latency, cost, and throughput.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#71839a"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="636" height="386" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="320" y="40" fill="#25374b" font-size="25" font-weight="700">LLM inference scheduling</text>
    <g fill="#dcebf8" stroke="#90b5d3" stroke-width="2">
      <rect x="85" y="66" width="130" height="40" rx="8"/>
      <rect x="255" y="66" width="130" height="40" rx="8"/>
      <rect x="425" y="66" width="130" height="40" rx="8"/>
    </g>
    <g fill="#345874" font-size="18">
      <text x="150" y="92">Request A</text>
      <text x="320" y="92">Request B</text>
      <text x="490" y="92">Request C</text>
    </g>
    <g fill="none" stroke="#71839a" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M150 108V136"/>
      <path d="M320 108V136"/>
      <path d="M490 108V136"/>
      <path d="M320 212V242"/>
    </g>
    <rect x="55" y="144" width="530" height="68" rx="10" fill="#e9e3f6" stroke="#b8a7d5" stroke-width="2"/>
    <text x="320" y="172" fill="#594477" font-size="21" font-weight="700">Control plane</text>
    <text x="320" y="196" fill="#594477" font-size="18">Resource allocation · routing · scaling</text>
    <rect x="55" y="250" width="530" height="68" rx="10" fill="#e0eee6" stroke="#98bba5" stroke-width="2"/>
    <text x="320" y="278" fill="#35624a" font-size="21" font-weight="700">Data plane</text>
    <text x="320" y="302" fill="#35624a" font-size="18">Batching · prefill · decoding</text>
    <g fill="#53657a" font-size="18">
      <text x="150" y="356">Latency</text>
      <text x="320" y="356">Cost</text>
      <text x="490" y="356">Throughput</text>
    </g>
  </g>
</svg>
